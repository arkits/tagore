<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tagore is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        background: light-dark(#fbf5e8, #211a14);
        color: light-dark(#2a2017, #eadcc2);
        font: 112.5%/1.5 Georgia, serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        box-sizing: border-box;
        place-items: center;
      }
      main { max-width: 24rem; }
      h1 { font-size: clamp(1.75rem, 6vw, 2.5rem); font-weight: normal; line-height: 1.15; }
      a {
        color: light-dark(#8a3b22, #d9875f);
        text-underline-offset: 0.25em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tagore is offline</h1>
      <p>Reconnect to your Tagore server to open your library and continue writing.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
